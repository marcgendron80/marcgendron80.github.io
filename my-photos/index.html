*{margin:0;padding:0;box-sizing:border-box}
body{background:#080818;color:#e2e8f0;font-family:'Inter',sans-serif;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:60vh;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 70% at 50% 0%,rgba(124,58,237,.18) 0%,transparent 70%)}

/* NAV */
nav{position:fixed;top:0;width:100%;z-index:100;padding:18px 6%;display:flex;align-items:center;justify-content:space-between;
  background:rgba(8,8,24,0.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(124,58,237,0.3)}
.logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.1rem;text-decoration:none;
  background:linear-gradient(90deg,#f59e0b,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-right{display:flex;align-items:center;gap:20px}
.back-link{color:#94a3b8;text-decoration:none;font-size:.85rem;letter-spacing:.05em;transition:.2s}
.back-link:hover{color:#f59e0b}
.lang-toggle{display:flex;align-items:center;gap:0;background:rgba(255,255,255,.05);border:1px solid rgba(124,58,237,0.3);border-radius:50px;overflow:hidden;font-size:.75rem;font-family:'Orbitron',sans-serif}
.lang-btn{padding:7px 14px;cursor:pointer;border:none;background:transparent;color:#94a3b8;letter-spacing:.08em;transition:.2s}
.lang-btn.active{background:linear-gradient(135deg,#7c3aed,#1e40af);color:#fff}
.lang-btn:hover:not(.active){color:#f59e0b}
.lang-btn:focus-visible,.back-link:focus-visible,.logo:focus-visible{outline:2px solid #a855f7;outline-offset:2px}

/* HEADER */
main{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:120px 6% 40px}
.section-tag{color:#f59e0b;font-size:.75rem;letter-spacing:.2em;font-weight:600;text-transform:uppercase;margin-bottom:12px}
h1{font-family:'Orbitron',sans-serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;line-height:1.15;margin-bottom:14px}
h1 .gradient{background:linear-gradient(135deg,#fbbf24,#a855f7,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.divider{width:60px;height:3px;background:linear-gradient(90deg,#f59e0b,#a855f7);border-radius:4px;margin:16px 0 20px}
.page-sub{color:#94a3b8;max-width:520px;line-height:1.7;margin-bottom:44px}

/* GRID */
.grid{columns:3 300px;column-gap:18px}
.grid figure{margin:0 0 18px;break-inside:avoid;background:#12123a;border:1px solid rgba(124,58,237,0.3);
  border-radius:16px;overflow:hidden;cursor:zoom-in;transition:.3s}
.grid figure:hover{transform:translateY(-4px);border-color:#a855f7;box-shadow:0 16px 40px rgba(124,58,237,.25)}
.grid img{width:100%;height:auto;display:block}

/* FOOTER */
footer{position:relative;z-index:1;text-align:center;padding:28px;color:#94a3b8;font-size:.8rem;border-top:1px solid rgba(124,58,237,0.3)}
footer span{color:#f59e0b}

/* LIGHTBOX */
#lb{position:fixed;inset:0;background:rgba(8,8,24,.96);display:none;align-items:center;justify-content:center;z-index:200}
#lb.open{display:flex}
#lb img{max-width:94vw;max-height:90vh;border-radius:10px;border:1px solid rgba(124,58,237,0.3)}
.lbBtn{position:fixed;background:#12123a;border:1px solid rgba(124,58,237,0.3);color:#e2e8f0;border-radius:50px;
  width:44px;height:44px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.lbBtn:hover{border-color:#f59e0b;color:#f59e0b}
.lbBtn:focus-visible{outline:2px solid #a855f7;outline-offset:2px}
#lbClose{top:16px;right:20px}
#lbPrev{left:16px;top:50%;transform:translateY(-50%)}
#lbNext{right:16px;top:50%;transform:translateY(-50%)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

<body>

<main>

<div id="lb" role="dialog" aria-modal="true">
  <img id="lbImg" src="" alt="">
  <button id="lbClose" class="lbBtn" type="button" aria-label="Close / Fermer">✕</button>
  <button id="lbPrev" class="lbBtn" type="button" aria-label="Previous / Précédente">←</button>
  <button id="lbNext" class="lbBtn" type="button" aria-label="Next / Suivante">→</button>
</div>

<script>
// ── TRANSLATIONS ── (same mechanism and localStorage key as the main site,
// so the visitor's language choice carries across pages)
const t={
  en:{
    g_back:'← Back to site',g_tag:'✦ Gallery',
    g_h1a:'PICTURES OF',g_h1b:'MONTREAL',
    g_sub:'Thirty urban shots — by Marc Gendron.',
    g_footer:'Pictures of Montreal'
  },
  fr:{
    g_back:'← Retour au site',g_tag:'✦ Galerie',
    g_h1a:'PHOTOS DE',g_h1b:'MONTRÉAL',
    g_sub:'Trente photos urbaines — par Marc Gendron.',
    g_footer:'Photos de Montréal'
  }
};

let lang='en';
function setLang(l,save=true){
  if(!t[l])l='en';
  lang=l;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if(t[l][k])el.textContent=t[l][k];
  });
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.lang===l);
  });
  document.documentElement.lang=l;
  if(save){try{localStorage.setItem('lang',l)}catch(e){}}
}
// restore saved language, else auto-detect from browser
(function(){
  let saved=null;try{saved=localStorage.getItem('lang')}catch(e){}
  const pref=saved||(((navigator.language||'en').toLowerCase().startsWith('fr'))?'fr':'en');
  if(pref!=='en')setLang(pref,false);
})();

// ── LIGHTBOX ──
const imgs=Array.prototype.slice.call(document.querySelectorAll('.grid img'));
const lb=document.getElementById('lb');
const lbImg=document.getElementById('lbImg');
let cur=-1;

function show(i){
  cur=(i+imgs.length)%imgs.length;
  lbImg.src=imgs[cur].src;
  lbImg.alt=imgs[cur].alt;
  lb.classList.add('open');
  document.body.style.overflow='hidden';
}
function hide(){
  lb.classList.remove('open');
  document.body.style.overflow='';
}

imgs.forEach((im,i)=>im.addEventListener('click',()=>show(i)));
document.getElementById('lbClose').addEventListener('click',hide);
document.getElementById('lbPrev').addEventListener('click',()=>show(cur-1));
document.getElementById('lbNext').addEventListener('click',()=>show(cur+1));
lb.addEventListener('click',e=>{if(e.target===lb)hide()});
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')hide();
  if(e.key==='ArrowLeft')show(cur-1);
  if(e.key==='ArrowRight')show(cur+1);
});
</script>
